# /etc/dash/config.toml —— 只放自举必需项。域名、保留期等运行时配置全在数据库里。
# setup.sh install 会生成真实文件（0600），本文件仅作参考。

[db]
driver = "oracle"                 # oracle | mysql
user   = "admin"
# 密码从环境变量 DASH_DB_PASSWORD 读，或写在此处（文件权限 0600）
password = "${DASH_DB_PASSWORD}"
dsn = "(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.ap-tokyo-1.oraclecloud.com))(connect_data=(service_name=xxxxx_tp.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))"
# 若 ADB 开启了强制双向 TLS，需提供 wallet 目录；关闭 mTLS 时留空
wallet_path = "/etc/dash/wallet"   # ADB 开启 mTLS 时必填；关闭 mTLS 时留空

max_open_conns = 20
max_idle_conns = 10
conn_max_lifetime_s = 1800

[server]
listen     = ":443"
listen_acme = ":80"
data_dir   = "/var/lib/dash"
master_key = "/etc/dash/master.key"
